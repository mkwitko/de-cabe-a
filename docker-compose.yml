services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: decabeca
      POSTGRES_PASSWORD: decabeca
      POSTGRES_DB: decabeca
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U decabeca']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
