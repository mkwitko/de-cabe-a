# Pilot hosting on the Oracle VM (ADR-010): Postgres + API behind Caddy (HTTPS).
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decabeca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: decabeca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U decabeca']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://decabeca:${POSTGRES_PASSWORD}@postgres:5432/decabeca
      TRUST_PROXY: '1'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ['80:80', '443:443']
    environment:
      API_HOST: ${API_HOST:?set API_HOST, e.g. api-origin.seudominio.com.br}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
