# Pilot hosting on the Oracle VM (ADR-010): Postgres, API and the web (Caddy) on
# 127.0.0.1:8088, published by the VM's Cloudflare Tunnel (no open ports, HTTPS at Cloudflare).
# Run from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Logs: JSON lines (pino) in Docker's json-file driver, rotated (see x-logging).
name: decabeca

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: decabeca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: decabeca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U decabeca']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    logging: *logging
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://decabeca:${POSTGRES_PASSWORD}@postgres:5432/decabeca
      TRUST_PROXY: '1'

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_HOME: ${VITE_ADSENSE_SLOT_HOME:-}
        VITE_ADSENSE_SLOT_RESULT: ${VITE_ADSENSE_SLOT_RESULT:-}
        VITE_ADSENSE_SLOT_TRACK: ${VITE_ADSENSE_SLOT_TRACK:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    ports: ['127.0.0.1:8088:80']

volumes:
  pgdata:
