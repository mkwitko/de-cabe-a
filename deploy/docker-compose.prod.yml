# Pilot hosting on the Oracle VM (ADR-010): Postgres, API, the static web (Caddy) and the edge
# proxy (Caddy) on 127.0.0.1:8088, published by the VM's Cloudflare Tunnel (no open ports, HTTPS
# at Cloudflare). Deploys go through deploy/release.sh -> deploy/rollout.sh (zero downtime,
# migrations as a separate step). A fresh install, from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod run --rm api npx prisma migrate deploy
# Logs: JSON lines (pino) in Docker's json-file driver, rotated (see x-logging).
# Memory caps: the VM is shared with other projects; each service gets a hard mem_limit so one
# runaway container cannot starve the rest. During a rolling swap two API containers run at once.
name: decabeca

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    mem_limit: 512m
    logging: *logging
    environment:
      POSTGRES_USER: decabeca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: decabeca
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U decabeca']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 640m
    mem_limit: 640m
    logging: *logging
    depends_on: { postgres: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://decabeca:${POSTGRES_PASSWORD}@postgres:5432/decabeca
      TRUST_PROXY: '1'
      # Every pack ever published, kept by id and checksum (ADR-023); the API archives its own on boot.
      CLUB_PACK_ARCHIVE_DIR: /club-packs/archive
    # The Modo Clube real pack (ADR-014): apps/api/club-packs/ on the VM, never in git, carried
    # from release to release by deploy/release.sh. CLUB_PACK_PATH in .env.prod points at it
    # (/club-packs/club-pack.json.gz); unset, the API and the web both use the generated dev pack.
    # Also read-only at /packs: the path the first setup wrote into .env.prod keeps working.
    volumes: ['../apps/api/club-packs:/club-packs', '../apps/api/club-packs:/packs:ro']
    # Gates the rolling swap (deploy/rollout.sh): the old container goes only once this passes.
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/v1/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
      start_interval: 1s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-ca-pub-3545965778969941}
        VITE_ADSENSE_SLOT_HOME: ${VITE_ADSENSE_SLOT_HOME:-3487159643}
        VITE_ADSENSE_SLOT_RESULT: ${VITE_ADSENSE_SLOT_RESULT:-4983560791}
        VITE_ADSENSE_SLOT_TRACK: ${VITE_ADSENSE_SLOT_TRACK:-9860996308}
        VITE_ADSENSE_SLOT_ALBUM: ${VITE_ADSENSE_SLOT_ALBUM:-7637644291}
        VITE_ADSENSE_SLOT_PROFILE: ${VITE_ADSENSE_SLOT_PROFILE:-5962259684}
        VITE_ADSENSE_SLOT_LEVEL: ${VITE_ADSENSE_SLOT_LEVEL:-5515537126}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        # The same pack as the API, slimmed into /packs/<id>.<checksum>.json (vite.config.ts).
        CLUB_PACK_PATH: ${CLUB_PACK_PATH:+/app/apps/api/club-packs/club-pack.json.gz}
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # Long-lived: owns the port and is recreated only when edge.Caddyfile or this block changes.
  edge:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    mem_limit: 64m
    logging: *logging
    volumes: ['./edge.Caddyfile:/etc/caddy/Caddyfile:ro']
    ports: ['127.0.0.1:8088:80']

volumes:
  pgdata:
