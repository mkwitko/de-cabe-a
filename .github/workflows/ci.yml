name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · unit · integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: decabeca
          POSTGRES_PASSWORD: decabeca
          POSTGRES_DB: decabeca
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U decabeca" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://decabeca:decabeca@localhost:5432/decabeca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=high

  e2e:
    name: e2e (Playwright, Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: decabeca
          POSTGRES_PASSWORD: decabeca
          POSTGRES_DB: decabeca_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U decabeca" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      E2E_DATABASE_URL: postgresql://decabeca:decabeca@localhost:5432/decabeca_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @decabeca/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
